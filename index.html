<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>WikiGlobe — Tri thức quay vòng quanh Trái Đất</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<!-- data is read inside map 'load' (after these run), so defer to unblock first paint -->
<script defer src="cities.js"></script><!-- global "civilization" index (works over file://) -->
<script defer src="places.js"></script><!-- notable places index (densifies mid-zoom) -->
<script defer src="events.js"></script><!-- dated history index for the time slider -->
<script defer src="vn-events.js"></script><!-- curated Vietnamese-history backbone -->
<script defer src="people.js"></script><!-- curated notable people (birthplaces) -->
<script defer src="community-ev.js"></script><!-- BYD charging map imported from Google My Maps -->
<style>
  :root{
    /* Anthropic / Claude palette: warm paper, clay-coral accent, editorial serif */
    --bg:#16130d; --panel:rgba(247,245,238,.95); --line:rgba(40,34,24,.12);
    --txt:#2b2925; --muted:#75716a; --accent:#cc785c; --accent2:#b3543a;
    --brand:#f3efe4; --serif:"Newsreader",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Phosphor icons: align like an app, kill italics */
  i.ph,i[class^="ph "],i[class*=" ph-"]{font-style:normal;line-height:1;vertical-align:-0.1em;display:inline-block}
  .erows,#panel .body,#countries,#results{-webkit-overflow-scrolling:touch}
  #p-extract i.ph,#p-extract i[class*="ph-"]{color:var(--accent);margin-right:3px;vertical-align:-0.12em}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
  /* starfield behind the globe (warm dusk cosmos) */
  body::before{content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff8, transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, #ffeede9c, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff7, transparent),
      radial-gradient(1px 1px at 85% 25%, #fff5, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #ffe9d6a0, transparent),
      radial-gradient(1px 1px at 10% 70%, #fff5, transparent),
      radial-gradient(2px 2px at 90% 85%, #fff7, transparent),
      radial-gradient(1px 1px at 30% 50%, #fff4, transparent),
      radial-gradient(circle at 50% 40%, #3a2a1c 0%, #16130d 62%);
    background-repeat:no-repeat}
  #map{position:absolute;inset:0;z-index:1;background:transparent}
  .maplibregl-canvas{outline:none}

  /* top bar */
  #bar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;
    gap:14px;padding:14px 18px;pointer-events:none}
  #brand{pointer-events:auto;cursor:pointer;flex:none;display:flex;align-items:center;gap:9px;
    font-family:var(--serif);font-weight:600;letter-spacing:.2px;font-size:20px;color:var(--brand);
    white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.5)}
  #brand .dot{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--accent),var(--accent2));
    box-shadow:0 0 14px var(--accent)}
  #brand small{font-family:-apple-system,system-ui,sans-serif;font-weight:500;
    color:rgba(243,239,228,.62);font-size:11.5px;margin-left:2px}
  .spacer{flex:1}
  .pill{pointer-events:auto;display:flex;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
  .pill button{all:unset;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;
    padding:6px 13px;border-radius:999px;transition:.15s}
  .pill button.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  #count{pointer-events:auto;font-size:12px;color:var(--muted);background:var(--panel);white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(10px)}
  /* when the article panel is open on desktop, slide the top-bar controls clear of it */
  #bar{transition:padding .35s cubic-bezier(.4,0,.2,1)}
  @media(min-width:760px){ body.panelopen #bar{padding-right:calc(min(420px,92vw) + 30px)} }

  /* search */
  #search{pointer-events:auto;position:relative;width:min(300px,42vw)}
  #search .field{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(10px);
    transition:border-color .15s}
  #search.focus .field{border-color:var(--accent)}
  #search .ico{color:var(--muted);font-size:13px;flex:none}
  #q{all:unset;flex:1;color:var(--txt);font-size:13.5px;min-width:0}
  #q::placeholder{color:var(--muted)}
  #results{position:absolute;top:46px;left:0;right:0;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.5)}
  #results:empty{display:none}
  #results .row{padding:10px 14px;font-size:13px;color:var(--txt);cursor:pointer;
    border-bottom:1px solid var(--line);line-height:1.3;transition:background .12s}
  #results .row:last-child{border-bottom:none}
  #results .row:hover,#results .row.sel{background:rgba(204,120,92,.13)}
  #results .row small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .row.msg{color:var(--muted);cursor:default}

  /* time-mode toggle (top bar) */
  /* single tools launcher in the bar */
  #menubtn{all:unset;pointer-events:auto;cursor:pointer;font-size:13px;font-weight:600;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    backdrop-filter:blur(10px);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  #menubtn:hover{border-color:var(--accent)}
  #menubtn .ico{font-size:15px}
  /* tools menu (open one feature at a time → less clutter, less lag) */
  #menu{position:absolute;z-index:9;top:62px;right:14px;width:min(288px,calc(100vw - 28px));
    background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);
    box-shadow:0 22px 60px rgba(0,0,0,.5);padding:8px;display:none;flex-direction:column;gap:3px}
  #menu.open{display:flex}
  #menu .mhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 9px;
    border-bottom:1px solid var(--line);margin-bottom:5px}
  #menu .mht{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--txt)}
  #menu .mhx{all:unset;cursor:pointer;color:var(--muted);font-size:18px;width:26px;height:26px;
    text-align:center;line-height:26px;border-radius:50%}
  #menu .mhx:hover{color:var(--accent)}
  .mitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:11px;font-size:14px;font-weight:600;color:var(--txt);transition:background .12s}
  .mitem:hover{background:rgba(204,120,92,.10)}
  .mitem .ico{font-size:17px;width:22px;text-align:center;flex:none}
  .mitem .lbl{display:inline!important}
  .mitem.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  #evbtn.on{background:linear-gradient(135deg,#16c784,#0f9d63);color:#fff}
  .mlang{display:flex;align-items:center;gap:10px;padding:9px 8px 4px;border-top:1px solid var(--line);margin-top:5px}
  .mlang .mll{font-size:16px}

  /* onboarding: pick a country */
  #onboard{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 32%,rgba(58,42,28,.78),rgba(22,19,13,.95));
    backdrop-filter:blur(8px);transition:opacity .5s}
  #onboard.hide{opacity:0;pointer-events:none}
  #onboard h2{margin:0;font-family:var(--serif);font-size:clamp(26px,4.4vw,40px);
    font-weight:500;letter-spacing:.2px;color:var(--brand)}
  #onboard h2 .g{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #onboard p{margin:0;color:rgba(243,239,228,.66);font-size:14.5px;max-width:460px;line-height:1.55}
  #countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;
    width:min(720px,92vw);max-height:46vh;overflow:auto;padding:4px}
  #countries button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;
    padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    font-size:13.5px;font-weight:600;color:var(--txt);transition:.15s}
  #countries button:hover{border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(204,120,92,.22)}
  #countries button .flag{width:24px;height:16px;border-radius:3px;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  #skip{all:unset;cursor:pointer;color:rgba(243,239,228,.7);font-size:13px;text-decoration:underline;
    text-underline-offset:3px}
  #skip:hover{color:var(--accent)}
  /* two-door entry */
  #doors{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:min(680px,92vw)}
  .door{all:unset;cursor:pointer;flex:1 1 240px;min-width:230px;max-width:320px;display:flex;
    flex-direction:column;gap:7px;padding:24px 22px;border-radius:20px;background:var(--panel);
    border:1px solid var(--line);transition:.18s;text-align:left}
  .door:hover,.door:focus-visible{transform:translateY(-3px);border-color:var(--accent);
    box-shadow:0 16px 40px rgba(204,120,92,.25)}
  .door-ev:hover,.door-ev:focus-visible{border-color:#16c784;box-shadow:0 16px 40px rgba(22,199,132,.25)}
  .door .dico{font-size:34px;line-height:1}
  .door .dt{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--txt)}
  .door .ds{font-size:13.5px;color:var(--muted);line-height:1.45}
  /* step 2 (knowledge): country picker — hide doors + heading */
  #ob-know{display:none}
  #onboard.know #doors{display:none}
  #onboard.know h2,#onboard.know p{display:none}
  #onboard.know #ob-know{display:flex;flex-direction:column;align-items:center;gap:18px}
  /* per-mode chrome: hide cross-mode tools + knowledge legend in EV mode */
  body.mode-ev #legend{display:none}
  body.mode-ev #exploreItem,body.mode-ev #heatbtn,body.mode-ev #timetoggle,
  body.mode-ev #evbtn,body.mode-ev #surprise{display:none}
  body.mode-knowledge #nearbtn,body.mode-knowledge #evbtn{display:none}
  #xrlink{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:#06121f;
    background:linear-gradient(135deg,var(--accent),var(--accent2));padding:9px 16px;border-radius:999px}
  #xrlink{color:#fff}
  #xrlink:hover{filter:brightness(1.08)}
  /* primary "use my location" CTA on entry */
  #locbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;font-size:15.5px;
    font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
    padding:14px 26px;border-radius:999px;box-shadow:0 10px 30px rgba(204,120,92,.38)}
  #locbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
  #locbtn .ico{font-size:18px}

  /* time slider (bottom) */
  #timebar{position:absolute;z-index:6;left:50%;bottom:24px;
    transform:translateX(-50%) translateY(200%);transition:transform .4s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;align-items:stretch;gap:9px;width:min(720px,94vw);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px;
    backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.5)}
  #timebar.on{transform:translateX(-50%)}
  .trow{display:flex;align-items:center;gap:14px}
  #erband{position:relative;height:20px;border-radius:6px;overflow:hidden;
    background:rgba(255,255,255,.04)}
  #erband .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;letter-spacing:.2px;color:rgba(0,0,0,.55);cursor:pointer;
    overflow:hidden;white-space:nowrap;border-right:1px solid rgba(0,0,0,.22);transition:filter .15s}
  #erband .seg:hover{filter:brightness(1.18)}
  #erband .seg.cur{box-shadow:inset 0 0 0 2px #fff,0 0 12px rgba(255,255,255,.4)}
  #eraname{flex:1;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  #eraname .vnflag{width:20px;height:14px;border-radius:2px;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  #vntoggle{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);transition:.15s}
  #vntoggle .vnflag{width:18px;height:12px;border-radius:2px;object-fit:cover;
    box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  #vntoggle.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent}
  #play{all:unset;cursor:pointer;width:36px;height:36px;flex:none;border-radius:50%;text-align:center;
    line-height:36px;font-size:14px;color:var(--accent);background:rgba(204,120,92,.16)}
  #year{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:none;
    background:linear-gradient(90deg,#ff5a5a,#ff9a3c,#ffd479,#c08bff,#7aa0ff,#5ad1ff)}
  #year::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;cursor:pointer;box-shadow:0 0 10px var(--accent),0 0 0 4px rgba(255,255,255,.12)}
  #year::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:#fff;
    cursor:pointer;box-shadow:0 0 10px var(--accent)}
  #yearlabel{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:104px;
    text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #ecount{font-size:11px;color:var(--muted);min-width:62px;text-align:right;line-height:1.25}

  /* hover preview tooltip */
  #tip{position:fixed;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    transition:opacity .12s;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;backdrop-filter:blur(10px);width:188px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  #tip.show{opacity:1}
  #tip .t{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.3}
  #tip img{display:none;width:100%;height:88px;object-fit:cover;border-radius:6px;margin-top:6px}

  /* hint */
  #hint{position:absolute;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--muted);backdrop-filter:blur(10px);
    transition:opacity .4s;pointer-events:none}
  #hint b{color:var(--accent)}

  /* featured place of the day (slim pill below the bar) */
  #featured{position:absolute;z-index:7;left:50%;top:64px;display:flex;align-items:center;gap:8px;
    opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-12px);transition:.4s;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;
    backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92vw}
  #featured.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  #featured .star{flex:none}
  #featured .ft{font-size:13px;color:var(--txt);cursor:pointer;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:min(60vw,420px)}
  #featured .ft b{color:var(--accent);font-weight:700}
  #featured .fx{all:unset;cursor:pointer;flex:none;width:24px;height:24px;border-radius:50%;
    text-align:center;line-height:24px;font-size:15px;color:var(--muted)}
  #featured .fx:hover{color:var(--accent)}
  @media(max-width:620px){ #featured{top:58px} #featured .ft{font-size:12px} }

  /* article panel */
  #panel{position:absolute;z-index:6;top:0;right:0;height:100%;width:min(420px,92vw);
    background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(16px);
    transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  #panel .hero{height:190px;background:#e7e1d4;background-size:cover;background-position:center;
    position:relative;flex:none}
  #panel .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,transparent 40%,var(--panel))}
  #panel .hero .herologo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
  #close{position:absolute;top:12px;right:12px;z-index:2;all:unset;cursor:pointer;
    width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);text-align:center;
    line-height:32px;font-size:18px;color:#fff}
  #panel .body{padding:0 22px 24px;overflow:auto}
  #panel h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:-32px 0 4px;
    position:relative;line-height:1.18}
  #panel .meta{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:14px}
  #panel .extract{font-size:14.5px;line-height:1.7;color:#4a4641}
  .pactions{display:flex;gap:8px;align-items:center;margin-top:18px}
  #panel a.read{flex:1;text-align:center;text-decoration:none;font-weight:600;
    font-size:13.5px;color:#fff;padding:11px 18px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .share{all:unset;cursor:pointer;flex:none;width:42px;height:42px;border-radius:10px;text-align:center;
    line-height:42px;font-size:16px;color:var(--accent);background:rgba(204,120,92,.12);
    border:1px solid var(--line);transition:.15s}
  .share:hover{background:rgba(204,120,92,.22)}
  .share.done{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  /* mini-map locator (world z0 tile + mercator pin) */
  #p-loc:empty{display:none}
  #p-loc{margin-top:20px}
  #p-loc .mini{position:relative;width:100%;max-width:236px;aspect-ratio:1;border-radius:12px;
    overflow:hidden;border:1px solid var(--line);background:#11100c center/100% 100% no-repeat}
  #p-loc .pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 3px rgba(204,120,92,.4),0 0 10px var(--accent)}
  #p-loc .coords{margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* nearby chips */
  #p-nearby:empty{display:none}
  #p-nearby{margin-top:18px}
  #p-nearby h4{margin:0 0 9px;font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px}
  #p-nearby .chips{display:flex;flex-wrap:wrap;gap:7px}
  #p-nearby .chip{cursor:pointer;font-size:12.5px;padding:6px 11px;border-radius:999px;
    background:rgba(40,34,24,.05);border:1px solid var(--line);color:var(--txt);transition:.15s;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #p-nearby .chip:hover{border-color:var(--accent);color:var(--accent)}
  .loading{padding:40px 22px;color:var(--muted);font-size:14px}
  /* EV station status badge in the panel */
  .evstatus{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
  .evstatus.ok{color:#0a7d52;background:rgba(22,199,132,.18)}
  .evstatus.na{color:#b4543a;background:rgba(204,80,60,.16)}
  /* realtime connector availability badge (TomTom) */
  .evlivewrap:empty{display:none}
  .evlivewrap{margin:0 0 8px}
  .evlive{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px}
  .evlive.ok{color:#0a7d52;background:rgba(22,199,132,.20)}
  .evlive.na{color:#b4543a;background:rgba(204,80,60,.18)}

function readHash(){
  const p = location.hash.slice(1).split('/');
  const z=+p[0], lat=+p[1], lng=+p[2];
  if(!isFinite(z)||!isFinite(lat)||!isFinite(lng)) return null;
  let time=null;
  for(const seg of p.slice(3)) if(/^t-?\d+$/.test(seg)) time=parseInt(seg.slice(1),10);
  return {zoom:z, center:[lng,lat], lang:LANGS.includes(p[3])?p[3]:null, time};
}

document.getElementById('legend').addEventListener('click',e=>{

  if(activeThemes.has(th)) activeThemes.delete(th); else activeThemes.add(th);

/* ---------- tier orchestration: global cities vs live geosearch ---------- */
const setVis=(ids,on)=>ids.forEach(id=>
  map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none'));

let lastGlobalCount=0;
const activeThemes=new Set(['city','h','c','n','s','p']);   // knowledge lenses (legend toggles)
function refreshGlobalTier(){
  if(!map.getSource('cities')) return;
  const feats=[];
  const add=(arr,fixed)=>{
    for(const c of arr){
      const title=c[3][LANG]; if(!title) continue;
      const theme=fixed||c[4]||'h';
      if(!activeThemes.has(theme)) continue;
      feats.push({type:'Feature',geometry:{type:'Point',coordinates:[c[0],c[1]]},
        properties:{title,theme}});
    }
  };
  const mobile=matchMedia('(max-width:620px)').matches;
  add(CITIES,'city');     // settlements (~4k)
  if(!mobile) add(PLACES,null);   // 35k places: skip on phones for smoothness
  add(PEOPLE,'p');        // notable people at their birthplace
  lastGlobalCount=feats.length;
  map.getSource('cities').setData({type:'FeatureCollection',features:feats});
  if(map.getSource('heat')) map.getSource('heat').setData({type:'FeatureCollection',features:feats});
}

// How many grid cells the current viewport needs; Infinity if it wraps the
// antimeridian (we skip those frames). Drives the tier choice.
function viewportCells(){
  const b=map.getBounds();
  const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
  if(e<=w) return Infinity;
  return Math.ceil((e-w)/CELL)*Math.ceil((n-s)/CELL);
}

function updateTiers(){
  if(!map.getSource('cities')||!map.getSource('wiki')) return;
  if(timeMode||evOn) return;                      // time / EV modes own the layers
  const global = viewportCells() > MAX_CELLS;    // viewport too big for live grid
  const heat = global && heatOn;                 // density view replaces the dots
  setVis(['heatmap'], heat);
  setVis(['cities-clusters','cities-cluster-count','cities-glow','cities-point'], global && !heat);
  setVis(['clusters','cluster-count','point-glow','point'], !global);
  const hint=document.getElementById('hint'), count=document.getElementById('count');
  if(global){
    map.getSource('wiki').setData(EMPTY);
    hint.style.opacity=1;
    count.textContent = lastGlobalCount ? tf('places',lastGlobalCount) : t('loadingMap');
  } else {
    hint.style.opacity=0;
    loadArticles();
  }
}

/* ---------- spinning globe (idle only, when zoomed out) ---------- */
let userInteracting=false;
const SECONDS_PER_REV=140;
function spinGlobe(){
  // Bail while any easeTo/flyTo is in flight (e.g. a cluster-click zoom) so the
  // idle spin never hijacks programmatic navigation; the chain resumes on moveend.
  if(userInteracting || map.isMoving() || map.getZoom()>=4) return;
  const c=map.getCenter(); c.lng -= 360/SECONDS_PER_REV;
  map.easeTo({center:c,duration:1000,easing:n=>n});
}
/* cinematic orbit: keep a chosen country centred and slowly rotate the camera */
let orbitOn=false;
function orbitStep(){
  if(!orbitOn || userInteracting || map.isMoving()) return;
  map.easeTo({bearing:map.getBearing()+9,duration:1100,easing:n=>n});
}
function tickIdle(){ if(orbitOn) orbitStep(); else spinGlobe(); }
function exitOrbit(){ orbitOn=false; }   // user takes the wheel → stop orbiting

/* cinematic camera move — long eased flight with a dramatic tilt */
function cinematic(center, zoom, pitch, then){
  if(then) map.once('moveend',then);
  map.flyTo({center, zoom, pitch:pitch||0, bearing:0, duration:2600, curve:1.5, essential:true});
}

/* ---------- live tier: grid-sample the viewport via Wikipedia geosearch ----------
   gsbbox rejects boxes above ~0.033 deg², so one viewport request fails almost
   everywhere. Instead split the viewport into ≤MAX_CELLS small cells, fetch them
   in parallel, and merge + dedupe by pageid into a single layer. */
let reqId=0, liveAbort=null;
async function loadArticles(){
  if(!map.getSource('wiki')) return;
  const b=map.getBounds();
  const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
  if(e<=w) return;                       // crosses antimeridian → skip this frame
  const cols=Math.ceil((e-w)/CELL), rows=Math.ceil((n-s)/CELL);
  if(cols*rows>MAX_CELLS) return;        // updateTiers should have kept us global

  const my=++reqId;
  if(liveAbort) liveAbort.abort();       // cancel the previous batch on fast panning
  liveAbort=new AbortController();
  const signal=liveAbort.signal;
  document.getElementById('count').textContent=t('loading');
  const cells=[];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const cw=w+i*CELL, ce=Math.min(cw+CELL,e);
    const cs=s+j*CELL, cn=Math.min(cs+CELL,n);
    cells.push(`${cn}%7C${cw}%7C${cs}%7C${ce}`);
  }
  try{
    const lists=await Promise.all(cells.map(box=>
      fetch(`https://${LANG}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
            `&list=geosearch&gslimit=500&gsbbox=${box}`,{signal})
        .then(r=>r.json()).then(j=>(j.query&&j.query.geosearch)||[]).catch(()=>[])));
    if(my!==reqId) return;               // a newer request superseded this one
    const seen=new Set(), features=[];
    for(const list of lists) for(const a of list){
      if(seen.has(a.pageid)) continue; seen.add(a.pageid);
      features.push({type:'Feature',
        geometry:{type:'Point',coordinates:[a.lon,a.lat]},
        properties:{title:a.title,pageid:a.pageid}});
    }
    map.getSource('wiki').setData({type:'FeatureCollection',features});
    document.getElementById('count').textContent=
      features.length? tf('inview',features.length) : t('noart');
  }catch(err){ if(my===reqId) document.getElementById('count').textContent=t('neterr'); }
}

// Web-Mercator fraction (0..1) for plotting on the z0 world tile.
function mercFrac(lon,lat){
  const x=(lon+180)/360;
  const s=Math.sin(Math.max(-85.05,Math.min(85.05,lat))*Math.PI/180);
  const y=0.5-Math.log((1+s)/(1-s))/(4*Math.PI);
  return {x,y};
}
function showLocator(lon,lat){
  const {x,y}=mercFrac(lon,lat);
  pLoc.innerHTML=
    `<div class="mini" style="background-image:url(https://a.basemaps.cartocdn.com/dark_all/0/0/0.png)">`+
    `<div class="pin" style="left:${(x*100).toFixed(2)}%;top:${(y*100).toFixed(2)}%"></div></div>`+
    `<div class="coords"><i class="ph ph-map-pin"></i> ${lat.toFixed(4)}, ${lon.toFixed(4)}</div>`;
}

let nearbySeq=0;
async function loadNearby(lon,lat,selfTitle){
  const my=++nearbySeq;
  try{
    const url=`https://${LANG}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
      `&list=geosearch&gsradius=10000&gslimit=12&gscoord=${lat}%7C${lon}`;
    const j=await(await fetch(url)).json();
    if(my!==nearbySeq) return;
    const list=((j.query&&j.query.geosearch)||[]).filter(a=>a.title!==selfTitle).slice(0,7);
    if(!list.length){ pNearby.innerHTML=''; return; }
    pNearby.innerHTML=`<h4>${t('nearby')}</h4><div class="chips">`+
      list.map(a=>`<div class="chip" data-t="${a.title.replace(/"/g,'&quot;')}" `+
        `data-lon="${a.lon}" data-lat="${a.lat}">${a.title}</div>`).join('')+`</div>`;
  }catch(e){ if(my===nearbySeq) pNearby.innerHTML=''; }
}
pNearby.addEventListener('click',e=>{

  openArticle({title:c.dataset.t});   // openArticle re-frames to its coordinates

async function openArticle(props){
  const my=++openSeq;
  panel.classList.add('open');
  document.body.classList.add('panelopen');
  document.getElementById('p-title').textContent=props.title;
  document.getElementById('p-meta').textContent=t('loading');
  document.getElementById('p-extract').textContent='';
  document.getElementById('hero').style.backgroundImage='none';
  document.getElementById('hero').innerHTML='';
  pLoc.innerHTML=''; pNearby.innerHTML='';
  try{
    const r=await fetch(`https://${LANG}.wikipedia.org/api/rest_v1/page/summary/`+
      encodeURIComponent(props.title));
    const j=await r.json();
    if(my!==openSeq) return;                 // superseded by a newer open
    document.getElementById('p-title').textContent=j.title||props.title;
    document.getElementById('p-meta').textContent=
      (j.description||t('wikiart'))+' · '+LANG.toUpperCase();
    document.getElementById('p-extract').textContent=j.extract||t('nosum');
    document.getElementById('p-link').href=
      (j.content_urls&&j.content_urls.desktop.page)||
      `https://${LANG}.wikipedia.org/?curid=${props.pageid||''}`;
    document.getElementById('p-link').textContent=t('read');   // reset (EV panel reuses it)
    document.getElementById('p-link').onclick=null;            // drop EV directions-chooser handler
    document.getElementById('hero').innerHTML='';              // drop EV brand logo
    const img=j.thumbnail&&j.thumbnail.source;
    document.getElementById('hero').style.backgroundImage=img?`url(${img})`:'none';
    const co=j.coordinates;
    if(co && isFinite(co.lon) && isFinite(co.lat)){
      articleCoord=[co.lon,co.lat];
      setMarker(co.lon,co.lat);
      showLocator(co.lon,co.lat);
      if(innerWidth>760) map.easeTo({center:[co.lon,co.lat],offset:[-220,0],duration:650});
      loadNearby(co.lon,co.lat,j.title||props.title);
    } else { articleCoord=null; clearMarker(); }
  }catch(e){ if(my===openSeq) document.getElementById('p-meta').textContent=t('loaderr'); }
}

function brandKey(st){
  const s=((st.operator||'')+' '+(st.network||'')+' '+(st.title||'')).toLowerCase();
  let best=''; for(const k in BRAND_DOMAINS) if(s.includes(k)&&k.length>best.length) best=k;
  return best;
}
function logoHtml(st,cls){
  const dom=BRAND_DOMAINS[brandKey(st)];

  const img=dom?`<img src="https://www.google.com/s2/favicons?domain=${dom}&sz=128" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="blogo ${cls||''}"><span class="bl-f">${letter}</span>${img}</span>`;
}

function openStation(p,coord){
  const my=++openSeq;                              // cancel any in-flight article fetch
  panel.classList.add('open'); document.body.classList.add('panelopen');
  clearMarker(); pNearby.innerHTML='';
  document.getElementById('hero').style.backgroundImage='linear-gradient(135deg,#0f5132,#16c784)';
  document.getElementById('hero').innerHTML='<div class="herologo">'+logoHtml(p,'big')+'</div>';
  document.getElementById('p-title').textContent=p.title;
  const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const meta=[]; if(p.operator) meta.push(esc(p.operator));
  if(p.network && p.network!==p.operator) meta.push(esc(p.network));
  meta.push(t('evstation'));
  document.getElementById('p-meta').innerHTML=meta.join(' · ');
  const rows=[];
  if(p.status){ const ok=/avail/i.test(p.status);
    rows.push(`<span class="evstatus ${ok?'ok':'na'}">${esc(p.status)}</span>`); }
  if(p.address)  rows.push(`<i class="ph ph-map-pin"></i> ${esc(p.address)}`);
  if(p.conn)     rows.push(`<i class="ph ph-plug"></i> <b>${t('evconn')}:</b> ${esc(p.conn)}`);
  if(p.ports)    rows.push(`<i class="ph ph-plugs-connected"></i> <b>${t('evports')}:</b> ${esc(p.ports)}`);
  if(p.power)    rows.push(`<i class="ph ph-lightning"></i> <b>${t('evpower')}:</b> ${esc(p.power)}`);
  if(p.fee)      rows.push(`<i class="ph ph-credit-card"></i> <b>${t('evfee')}:</b> ${p.fee==='no'||/free/i.test(p.fee)?t('evfree'):p.fee==='yes'?t('evpaid'):esc(p.fee)}`);
  if(p.access)   rows.push(`<i class="ph ph-lock-simple"></i> ${esc(p.access)}`);
  if(p.checkdate)rows.push(`<i class="ph ph-clock-counter-clockwise"></i> <b>${t('evchecked')}:</b> ${esc(p.checkdate)}`);
  let html = '<div id="ev-live" class="evlivewrap"></div>' +
    (rows.length ? rows.map(r=>`<div style="margin:5px 0">${r}</div>`).join('')
    : `<span style="color:var(--muted)">${t('evnodata')}</span>`);
  const appUrl=BRAND_APPS[brandKey(p)]||p.website||'';
  if(appUrl){ const u=esc(appUrl.replace(/^https?:\/\//,'').replace(/\/$/,''));
    html+=`<div style="margin:11px 0 0"><a href="${esc(appUrl)}" target="_blank" rel="noopener" `+
      `style="color:var(--accent);font-weight:700"><i class="ph ph-plug"></i> ${t('brandApp')}</a> `+
      `<span style="color:var(--muted);font-size:11.5px">${u}</span></div>`; }
  html+=`<div style="margin:12px 0 0;font-size:11.5px;color:var(--muted)">${t('evsrc')}</div>`;
  document.getElementById('p-extract').innerHTML=html;
  // realtime connector availability (only where the provider has a live id — e.g. EU/US)
  if(p.availId && EV_PROXY){
    fetch(`${EV_PROXY}/availability?id=${encodeURIComponent(p.availId)}`).then(r=>r.json()).then(a=>{
      if(my!==openSeq) return;

/* ---------- hover preview tooltip (title + thumbnail) ---------- */
const tip=document.getElementById('tip');
const tipTitle=tip.querySelector('.t'), tipImg=tip.querySelector('img');
const thumbCache=new Map();   // title → thumbnail URL ('' = none / in-flight)
function fetchThumb(title){
  if(thumbCache.has(title)) return;
  thumbCache.set(title,'');
  fetch(`https://${LANG}.wikipedia.org/api/rest_v1/page/summary/`+encodeURIComponent(title))
    .then(r=>r.json()).then(j=>{
      const src=(j.thumbnail&&j.thumbnail.source)||'';
      thumbCache.set(title,src);
      if(src && tip.classList.contains('show') && tipTitle.textContent===title){
        tipImg.src=src; tipImg.style.display='block';
      }
    }).catch(()=>{});
}
function showTip(e){
  const title=e.features[0].properties.title;
  tip.style.left=e.point.x+'px';
  tip.style.top=(e.point.y-14)+'px';
  tipTitle.textContent=title;
  const cached=thumbCache.get(title);
  if(cached){ tipImg.src=cached; tipImg.style.display='block'; }
  else { tipImg.style.display='none'; if(cached===undefined) fetchThumb(title); }
  tip.classList.add('show');
}
function hideTip(){ tip.classList.remove('show'); }

/* Vietnamese history periodised (non-overlapping) — the first detailed case.
   Other countries can later get their own era table; VN is the reference. */
const VN_ERAS=[
  {n:'Hồng Bàng – Âu Lạc', short:'Hồng Bàng', s:-2879, e:-208, c:'#8d6e63'},
  {n:'Bắc thuộc',           short:'Bắc thuộc', s:-207,  e:938,  c:'#a1887f'},
  {n:'Ngô – Đinh – Tiền Lê',short:'Ngô–Đinh', s:939,   e:1009, c:'#ef9a9a'},
  {n:'Nhà Lý',              short:'Lý',        s:1009,  e:1225, c:'#ffcc80'},
  {n:'Nhà Trần – Hồ',       short:'Trần–Hồ',   s:1225,  e:1407, c:'#fff59d'},
  {n:'Thuộc Minh',          short:'Minh',      s:1407,  e:1427, c:'#c5e1a5'},
  {n:'Nhà Lê',              short:'Lê',        s:1428,  e:1788, c:'#80cbc4'},
  {n:'Tây Sơn',             short:'Tây Sơn',   s:1788,  e:1802, c:'#81d4fa'},
  {n:'Nhà Nguyễn',          short:'Nguyễn',    s:1802,  e:1945, c:'#b39ddb'},
  {n:'Hiện đại',            short:'Hiện đại',  s:1945,  e:2026, c:'#90caf9'},
];
const erband=document.getElementById('erband');
const eraname=document.getElementById('eraname');
function eraPct(y){ const a=+yearSlider.min,b=+yearSlider.max;
  return (Math.max(a,Math.min(b,y))-a)/(b-a)*100; }
function buildEraBand(){
  erband.innerHTML=VN_ERAS.map((e,i)=>{
    const l=eraPct(e.s), w=eraPct(e.e)-l;
    return `<div class="seg" data-i="${i}" style="left:${l}%;width:${w}%;background:${e.c}"`+
      ` title="${e.n} (${fmtYear(e.s)} – ${fmtYear(e.e)})">${w>3.5?e.short:''}</div>`;
  }).join('');
  erband.onclick=ev=>{
    const seg=ev.target.closest('.seg'); if(!seg) return;
    const e=VN_ERAS[+seg.dataset.i];
    const mid=Math.round((Math.max(+yearSlider.min,e.s)+Math.min(+yearSlider.max,e.e))/2);
    stopPlay(); yearSlider.value=mid; refreshEvents();
  };
}
function updateEra(y){
  const cur=VN_ERAS.find(e=>y>=e.s && y<=e.e);
  eraname.innerHTML='<img class="vnflag" src="https://flagcdn.com/vn.svg" alt="VN"> '+
    (cur ? cur.n : t('vihist'));
  [...erband.children].forEach((el,i)=>el.classList.toggle('cur',VN_ERAS[i]===cur));
}

function fmtYear(y){
  if(y>=0) return ''+y;
  const n=-y; return LANG==='ja' ? t('bce')+n : n+' '+t('bce');
}

let vnOnly=false;
const inVN=(lon,lat)=> lon>=102 && lon<=110 && lat>=8 && lat<=24;   // Vietnam bbox
function refreshEvents(){
  if(!map.getSource('events')) return;
  const year=+yearSlider.value, W=EVENT_WINDOW, feats=[];
  for(const ev of EVENTS){
    if(vnOnly && !inVN(ev[0],ev[1])) continue;
    const dy=Math.abs(ev[2]-year); if(dy>W) continue;
    const title=ev[3][LANG]; if(!title) continue;
    feats.push({type:'Feature',geometry:{type:'Point',coordinates:[ev[0],ev[1]]},
      properties:{title,year:ev[2],glow:+(1-dy/W).toFixed(3)}});
  }
  map.getSource('events').setData({type:'FeatureCollection',features:feats});
  yearLabel.textContent=fmtYear(year);
  ecount.textContent=vnOnly?tf('eventsVN',feats.length):tf('events',feats.length);
  updateEra(year);
  writeHash();
}

function stopPlay(){ if(playTimer){ clearInterval(playTimer); playTimer=0; playBtn.innerHTML='<i class="ph-fill ph-play"></i>'; } }
function startPlay(){
  playBtn.innerHTML='<i class="ph-fill ph-pause"></i>';
  playTimer=setInterval(()=>{
    let y=+yearSlider.value+6;
    if(y>+yearSlider.max) y=+yearSlider.min;   // loop back to the start of time
    yearSlider.value=y; refreshEvents();
  },110);
}

function setTimeMode(on){
  timeMode=on;
  timetoggle.classList.toggle('on',on);
  timebar.classList.toggle('on',on);
  const lg=document.getElementById('legend');
  lg.style.opacity=on?0:1; lg.style.pointerEvents=on?'none':'auto';
  setVis(['events-glow','events-point'],on);
  if(on){
    if(evOn){ evOn=false; evbtn.classList.remove('on');
      setVis(['ev-clusters','ev-cluster-count','ev-glow','ev-point'],false);
      if(map.getSource('ev')) map.getSource('ev').setData(EMPTY); }
    setVis(['cities-clusters','cities-cluster-count','cities-glow','cities-point',
            'clusters','cluster-count','point-glow','point','heatmap'],false);
    document.getElementById('hint').style.opacity=0;
    document.getElementById('count').textContent=tf('timecount',EVENTS.length);
    buildEraBand(); refreshEvents();
  }else{
    stopPlay();
    map.getSource('events').setData(EMPTY);
    updateTiers(); writeHash();
  }
}

/* ---------- place search (Nominatim geocoder) ---------- */
const qInput=document.getElementById('q');
const resBox=document.getElementById('results');
const searchEl=document.getElementById('search');
let searchTimer=0, searchSeq=0, hits=[], selIdx=-1;

function clearResults(){ resBox.innerHTML=''; hits=[]; selIdx=-1; }
function renderMsg(text){ resBox.innerHTML=`<div class="row msg">${text}</div>`; }

function renderResults(){
  resBox.innerHTML=hits.map((h,i)=>{
    const name=h.display_name, comma=name.indexOf(', ');
    const head=comma<0?name:name.slice(0,comma), rest=comma<0?'':name.slice(comma+2);
    return `<div class="row${i===selIdx?' sel':''}" data-i="${i}">${head}`+
           (rest?`<small>${rest}</small>`:'')+`</div>`;
  }).join('');
}

async function runSearch(query){
  const my=++searchSeq;
  renderMsg(t('searching'));
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6'+
      `&accept-language=${LANG}&q=${encodeURIComponent(query)}`;
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(my!==searchSeq) return;            // superseded by a newer keystroke
    hits=j; selIdx=-1;
    if(!hits.length){ renderMsg(t('noplace')); return; }
    renderResults();
  }catch(e){ if(my===searchSeq) renderMsg(t('searcherr')); }
}

function gotoHit(h){
  if(!h) return;
  const bb=h.boundingbox;                 // [south, north, west, east] as strings
  if(bb){
    map.fitBounds([[+bb[2],+bb[0]],[+bb[3],+bb[1]]],{padding:80,maxZoom:13,duration:1200});
  }else{
    map.flyTo({center:[+h.lon,+h.lat],zoom:11,duration:1200});
  }
  clearResults(); qInput.value=h.display_name.split(', ')[0]; qInput.blur();
}

qInput.addEventListener('input',()=>{
  const v=qInput.value.trim();
  clearTimeout(searchTimer);
  if(v.length<2){ clearResults(); return; }
  searchTimer=setTimeout(()=>runSearch(v),350);   // debounce + respect Nominatim rate limit
});
qInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(hits.length){selIdx=(selIdx+1)%hits.length;renderResults();} }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(hits.length){selIdx=(selIdx-1+hits.length)%hits.length;renderResults();} }
  else if(e.key==='Enter'){ if(hits.length) gotoHit(hits[selIdx>=0?selIdx:0]); }
  else if(e.key==='Escape'){ clearResults(); qInput.blur(); }
});
resBox.addEventListener('mousedown',e=>{               // mousedown beats input blur
  const row=e.target.closest('.row[data-i]'); if(!row) return;
  e.preventDefault(); gotoHit(hits[+row.dataset.i]);
});
qInput.addEventListener('focus',()=>{ searchEl.classList.add('focus'); });
qInput.addEventListener('blur',()=>{ searchEl.classList.remove('focus'); setTimeout(clearResults,120); });

/* ---------- EV charging tier: live OpenStreetMap charging stations ---------- */
let evOn=false, evReq=0, evAbort=null;
const evbtn=document.getElementById('evbtn');
const EV_CONNECTORS={'socket:type2':'Type 2','socket:type2_cable':'Type 2','socket:type2_combo':'CCS2',
  'socket:ccs':'CCS','socket:chademo':'CHAdeMO','socket:type1':'Type 1','socket:type1_combo':'CCS1',
  'socket:tesla_supercharger':'Tesla','socket:tesla_destination':'Tesla','socket:type3':'Type 3',
  'socket:type3c':'Type 3','socket:schuko':'Schuko','socket:cee_blue':'CEE'};
function evProps(tg){
  const conns=[]; for(const k in EV_CONNECTORS) if(tg[k]&&tg[k]!=='no') conns.push(EV_CONNECTORS[k]);
  let power=''; for(const k of ['socket:type2:output','socket:ccs:output','socket:chademo:output',
    'socket:type2_combo:output','maxpower','charge']) if(tg[k]){ power=String(tg[k]); break; }
  if(power && /^[\d.]+$/.test(power)) power+=' kW';
  const cap=tg['capacity:motorcar']||tg.capacity||'';
  return {                                            // unified station schema (matches the proxy)
    title: tg.name||tg.operator||tg.brand||tg.network||t('evstation'),
    operator: tg.operator||tg.brand||tg.network||'', network: tg.network||'', status:'',
    conn:[...new Set(conns)].join(' · '), ports: cap?('×'+cap):'', power,
    fee:tg.fee||'', access:(tg.access&&tg.access!=='yes')?tg.access:'',
    website:tg.website||tg['contact:website']||'',
    address:[tg['addr:street'],tg['addr:city']].filter(Boolean).join(', '), checkdate:tg.check_date||''
  };
}
async function loadEV(){
  if(!evOn||!map.getSource('ev')) return;
  const count=document.getElementById('count'), hint=document.getElementById('hint');
  if(map.getZoom()<5.2){                            // Overpass over a whole continent = timeout
    lastEvStations=[]; map.getSource('ev').setData(EMPTY);
    hint.innerHTML='<i class="ph ph-charging-station"></i> '+t('evzoom'); hint.style.opacity=1;
    count.textContent=t('evzoom'); renderEvList([]); return;
  }
  hint.style.opacity=0;
  const b=map.getBounds(), w=b.getWest(),e=b.getEast(),s=b.getSouth(),n=b.getNorth();
  if(e<=w) return;                                  // antimeridian → skip this frame
  const my=++evReq;
  if(evAbort) evAbort.abort();                      // cancel the previous query on fast panning
  evAbort=new AbortController();
  count.textContent=t('loading');
  try{
    // Prefer the Worker proxy (US AFDC + global OSM, key hidden); else Overpass direct.
    const stations = EV_PROXY
      ? await fetchProxy(s,w,n,e,evAbort.signal)
      : await fetchOverpass(s,w,n,e,evAbort.signal);
    if(my!==evReq) return;                           // a newer query already ran
    const list = Array.isArray(stations) ? stations.slice() : [];
    // merge community (BYD) stations within the viewport, deduped ~100m
    if(COMMUNITY.length){
      const have=new Set(list.map(st=>st.lat.toFixed(3)+','+st.lon.toFixed(3)));
      for(const st of COMMUNITY) if(st.lat>=s&&st.lat<=n&&st.lon>=w&&st.lon<=e){
        const k=st.lat.toFixed(3)+','+st.lon.toFixed(3);
        if(!have.has(k)){ have.add(k); list.push(st); }
      }
    }
    if(stations===null && !list.length){ count.textContent=t('neterr'); return; }
    lastEvStations=list.filter(st=>isFinite(st.lat)&&isFinite(st.lon));
    applyEvRender();                                  // filter → map dots + finder list
  }catch(err){ if(my===evReq && err.name!=='AbortError') count.textContent=t('neterr'); }
}
async function fetchProxy(s,w,n,e,signal){       // Cloudflare Worker → normalised {stations}
  const r=await fetch(`${EV_PROXY}/stations?bbox=${s},${w},${n},${e}`,{signal});
  if(!r.ok) return null;
  const j=await r.json();
  return j.stations||[];
}
async function fetchOverpass(s,w,n,e,signal){     // direct OSM fallback (GET ?data= avoids 406)
  const q=`[out:json][timeout:25];node[amenity=charging_station](${s},${w},${n},${e});out body 600;`;
  const enc=encodeURIComponent(q);
  const endpoints=[
    'https://overpass-api.de/api/interpreter?data='+enc,
    'https://overpass.kumi.systems/api/interpreter?data='+enc,
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter?data='+enc,
  ];
  for(const url of endpoints){
    try{
      const r=await fetch(url,{signal});
      if(!r.ok) continue;                           // 406/429/5xx → next mirror
      const j=await r.json();
      return (j.elements||[]).filter(el=>isFinite(el.lat)&&isFinite(el.lon))
        .map(el=>({...evProps(el.tags||{}), lat:el.lat, lon:el.lon}));
    }catch(e){ if(e.name==='AbortError') throw e; } // cancelled → propagate to loadEV
  }
  return null;
}
function setEvMode(on){
  evOn=on; evbtn.classList.toggle('on',on);
  const lg=document.getElementById('legend');
  setVis(['ev-clusters','ev-cluster-count','ev-glow','ev-point'],on);
  if(on){
    if(timeMode) setTimeMode(false);
    if(heatOn){ heatOn=false; document.getElementById('heatbtn').classList.remove('on'); }
    exitOrbit();
    setVis(['cities-clusters','cities-cluster-count','cities-glow','cities-point',
            'clusters','cluster-count','point-glow','point','heatmap'],false);
    lg.style.opacity=0; lg.style.pointerEvents='none';
    evListOpen=true; loadEV();
  }else{
    if(map.getSource('ev')) map.getSource('ev').setData(EMPTY);
    document.getElementById('hint').innerHTML='<i class="ph ph-globe-hemisphere-east"></i> '+t('hint');
    lg.style.opacity=1; lg.style.pointerEvents='auto';
    evListOpen=false; evlist.classList.remove('open'); document.body.classList.remove('evlistopen');
    evFilters.clear(); document.querySelectorAll('.efilters .chip.on').forEach(c=>c.classList.remove('on'));
    if(hereOn){ hereMarker.remove(); hereOn=false; }
    updateTiers();
  }
}
evbtn.onclick=()=>setEvMode(!evOn);

/* ---------- "around me": geolocation + nearest-stations list ---------- */
const nearbtn=document.getElementById('nearbtn');
const evlist=document.getElementById('evlist');
let userLoc=null, lastEvStations=[], evRows=[], evListOpen=false; const evFilters=new Set();
const hereEl=document.createElement('div'); hereEl.className='wg-here';
const hereMarker=new maplibregl.Marker({element:hereEl}); let hereOn=false;
function distKm(la1,lo1,la2,lo2){
  const R=6371,d=Math.PI/180;
  const a=Math.sin((la2-la1)*d/2)**2+Math.cos(la1*d)*Math.cos(la2*d)*Math.sin((lo2-lo1)*d/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function locateMe(){
  if(!navigator.geolocation){ document.getElementById('count').textContent=t('geoerr'); return; }
  nearbtn.classList.add('on');
  navigator.geolocation.getCurrentPosition(pos=>{
    userLoc=[pos.coords.longitude,pos.coords.latitude];
    hereMarker.setLngLat(userLoc).addTo(map); hereOn=true;
    evListOpen=true;
    if(!evOn) setEvMode(true);
    exitOrbit();
    cinematic(userLoc,13,0);            // fly to me → moveend → loadEV → finder sorted by distance
  },()=>{ nearbtn.classList.remove('on'); document.getElementById('count').textContent=t('geoerr'); },
  {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
nearbtn.onclick=()=>locateMe();        // 📍 (re)centers on the user
const escH=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const evCenter=()=> userLoc || [map.getCenter().lng, map.getCenter().lat];
function passEV(st){
  for(const f of evFilters){
    if(f==='fast'){ if(!((parseFloat(st.power)||0)>=50 || /CCS|CHAdeMO/i.test(st.conn||''))) return false; }
    else if(f==='free'){ const fee=(st.fee||'').toLowerCase(); if(!(fee==='no'||/free|miễn|gratu|無料/.test(fee))) return false; }
    else if(f==='ccs'){ if(!/ccs/i.test(st.conn||'')) return false; }
    else if(f==='type2'){ if(!/type ?2/i.test(st.conn||'')) return false; }
    else if(f==='byd'){ if(!/byd/i.test((st.title||'')+(st.operator||'')+(st.network||''))) return false; }
    else if(f==='vinfast'){ if(!/vin\s?fast|v-?green/i.test((st.title||'')+(st.operator||'')+(st.network||''))) return false; }
  }
  return true;
}
// filter → repaint map dots + finder list (no refetch)
function applyEvRender(){
  if(!evOn||!map.getSource('ev')) return;
  const shown=lastEvStations.filter(passEV);
  map.getSource('ev').setData({type:'FeatureCollection',features:shown.map(st=>({
    type:'Feature',geometry:{type:'Point',coordinates:[st.lon,st.lat]},properties:st}))});
  document.getElementById('count').textContent=tf('evcount',shown.length);
  renderEvList(shown);
}
function renderEvList(shown){
  if(!evOn) return;
  if(!evListOpen){ evlist.classList.remove('open'); document.body.classList.remove('evlistopen'); return; }
  const c=evCenter();
  const ranked=shown.map(st=>({st,d:distKm(c[1],c[0],st.lat,st.lon)})).sort((a,b)=>a.d-b.d);
  evRows=ranked.slice(0,60);
  evlist.querySelector('.eht').innerHTML=(userLoc?'<i class="ph ph-crosshair-simple"></i> ':'<i class="ph ph-charging-station"></i> ')+tf(userLoc?'evnear':'evcount',ranked.length);
  evlist.querySelector('.erows').innerHTML = ranked.length ? evRows.map(({st,d},i)=>{
    const ok=/avail|oper/i.test(st.status);
    const bits=[];
    if(st.operator) bits.push(escH(st.operator));
    if(st.power) bits.push(escH(st.power)); else if(st.ports) bits.push(escH(st.ports));
    if(st.conn) bits.push(escH(st.conn));
    return `<div class="erow" data-i="${i}">${logoHtml(st,'sm')}<div class="einfo">`+
      `<div class="en">${escH(st.title||t('evstation'))}</div>`+
      `<div class="em">${bits.join(' · ')}${bits.length?' · ':''}<span class="dist">${d<10?d.toFixed(1):Math.round(d)} km</span></div>`+
      `</div>${st.status?`<span class="es ${ok?'ok':'na'}">${escH(st.status)}</span>`:''}</div>`;
  }).join('') : `<div class="emsg">${map.getZoom()<5.2?t('evzoom'):t('noart')}</div>`;
  evlist.classList.add('open'); document.body.classList.add('evlistopen');
}
evlist.querySelector('.erows').addEventListener('click',e=>{
  const row=e.target.closest('.erow'); if(!row) return;
  const item=evRows[+row.dataset.i]; if(!item) return;
  openStation(item.st,[item.st.lon,item.st.lat]);
});
evlist.querySelector('.ehx').onclick=()=>{
  evListOpen=false; evlist.classList.remove('open'); document.body.classList.remove('evlistopen');
};
evlist.querySelector('.efilters').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const f=c.dataset.f;
  if(evFilters.has(f)) evFilters.delete(f); else evFilters.add(f);
  c.classList.toggle('on', evFilters.has(f));
  applyEvRender();
});
document.getElementById('evtab').onclick=()=>{ evListOpen=true; applyEvRender(); };

/* ---------- "✨ Khám phá": cinematic jump to a random notable place ---------- */
const surpriseBtn=document.getElementById('surprise');
function surprise(){
  const pool=[];
  for(const c of PLACES) if(c[3][LANG]) pool.push(c);
  if(!pool.length) return;
  // PLACES is sorted by notability; bias toward the famous but keep serendipity.
  const c=pool[Math.floor(Math.pow(Math.random(),1.7)*pool.length)];
  if(timeMode) setTimeMode(false);
  exitOrbit();
  openArticle({title:c[3][LANG]});
  cinematic([c[0],c[1]], 12, 45);
}
surpriseBtn.onclick=surprise;

/* ---------- featured place of the day (deterministic, changes daily) ---------- */
let featuredPlace=null, featuredTimer=0, featuredShown=false;
function dailyFeatured(){
  const pool=[]; for(const c of PLACES) if(c[3]&&c[3][LANG]) pool.push(c);
  if(!pool.length) return null;
  const N=Math.min(pool.length,1500);              // bias toward the notable head
  const seed=Math.floor(Date.now()/8.64e7);        // day index since epoch
  return pool[(seed*2654435761>>>0)%N];
}
function showFeatured(){
  if(START || MODE==='ev') return;                 // skip in EV mode / deep-links
  featuredPlace=dailyFeatured(); if(!featuredPlace) return;
  const el=document.getElementById('featured');
  el.querySelector('.ft').innerHTML=`<b>${t('featuredToday')}:</b> ${featuredPlace[3][LANG]}`;
  el.classList.add('show');
  clearTimeout(featuredTimer); featuredTimer=setTimeout(()=>el.classList.remove('show'),15000);
}
document.querySelector('#featured .ft').onclick=()=>{
  if(!featuredPlace) return;
  document.getElementById('featured').classList.remove('show');
  if(timeMode) setTimeMode(false); if(evOn) setEvMode(false); exitOrbit();
  openArticle({title:featuredPlace[3][LANG]});
  cinematic([featuredPlace[0],featuredPlace[1]],12,45);
};
document.querySelector('#featured .fx').onclick=()=>
  document.getElementById('featured').classList.remove('show');

let MODE=null;                                   // 'knowledge' | 'ev' — the chosen door
function setMode(m){
