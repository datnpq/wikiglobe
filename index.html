<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>WikiGlobe — Tri thức quay vòng quanh Trái Đất</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="cities.js"></script><!-- global "civilization" index (works over file://) -->
<script src="places.js"></script><!-- notable places index (densifies mid-zoom) -->
<script src="events.js"></script><!-- dated history index for the time slider -->
<style>
  :root{
    /* Anthropic / Claude palette: warm paper, clay-coral accent, editorial serif */
    --bg:#16130d; --panel:rgba(247,245,238,.95); --line:rgba(40,34,24,.12);
    --txt:#2b2925; --muted:#75716a; --accent:#cc785c; --accent2:#b3543a;
    --brand:#f3efe4; --serif:"Newsreader",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
  /* starfield behind the globe (warm dusk cosmos) */
  body::before{content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff8, transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, #ffeede9c, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff7, transparent),
      radial-gradient(1px 1px at 85% 25%, #fff5, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #ffe9d6a0, transparent),
      radial-gradient(1px 1px at 10% 70%, #fff5, transparent),
      radial-gradient(2px 2px at 90% 85%, #fff7, transparent),
      radial-gradient(1px 1px at 30% 50%, #fff4, transparent),
      radial-gradient(circle at 50% 40%, #3a2a1c 0%, #16130d 62%);
    background-repeat:no-repeat}
  #map{position:absolute;inset:0;z-index:1;background:transparent}
  .maplibregl-canvas{outline:none}

  /* top bar */
  #bar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;
    gap:14px;padding:14px 18px;pointer-events:none}
  #brand{pointer-events:auto;flex:none;display:flex;align-items:center;gap:9px;font-family:var(--serif);
    font-weight:600;letter-spacing:.2px;font-size:20px;color:var(--brand);white-space:nowrap;
    text-shadow:0 1px 12px rgba(0,0,0,.5)}
  #brand .dot{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--accent),var(--accent2));
    box-shadow:0 0 14px var(--accent)}
  #brand small{font-family:-apple-system,system-ui,sans-serif;font-weight:500;
    color:rgba(243,239,228,.62);font-size:11.5px;margin-left:2px}
  .spacer{flex:1}
  .pill{pointer-events:auto;display:flex;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
  .pill button{all:unset;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;
    padding:6px 13px;border-radius:999px;transition:.15s}
  .pill button.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  #count{pointer-events:auto;font-size:12px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(10px)}
  /* when the article panel is open on desktop, slide the top-bar controls clear of it */
  #bar{transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
  @media(min-width:760px){ body.panelopen #bar{padding-right:calc(min(420px,92vw) + 30px)} }

  /* search */
  #search{pointer-events:auto;position:relative;width:min(300px,42vw)}
  #search .field{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(10px);
    transition:border-color .15s}
  #search.focus .field{border-color:var(--accent)}
  #search .ico{color:var(--muted);font-size:13px;flex:none}
  #q{all:unset;flex:1;color:var(--txt);font-size:13.5px;min-width:0}
  #q::placeholder{color:var(--muted)}
  #results{position:absolute;top:46px;left:0;right:0;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.5)}
  #results:empty{display:none}
  #results .row{padding:10px 14px;font-size:13px;color:var(--txt);cursor:pointer;
    border-bottom:1px solid var(--line);line-height:1.3;transition:background .12s}
  #results .row:last-child{border-bottom:none}
  #results .row:hover,#results .row.sel{background:rgba(204,120,92,.13)}
  #results .row small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .row.msg{color:var(--muted);cursor:default}

  /* time-mode toggle (top bar) */
  #timetoggle,#satbtn,#surprise{all:unset;pointer-events:auto;cursor:pointer;font-size:12.5px;
    font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:7px 13px;backdrop-filter:blur(10px);transition:.15s;white-space:nowrap}
  #timetoggle.on,#satbtn.on,#surprise:hover{color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}

  /* onboarding: pick a country */
  #onboard{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 32%,rgba(58,42,28,.78),rgba(22,19,13,.95));
    backdrop-filter:blur(8px);transition:opacity .5s}
  #onboard.hide{opacity:0;pointer-events:none}
  #onboard h2{margin:0;font-family:var(--serif);font-size:clamp(26px,4.4vw,40px);
    font-weight:500;letter-spacing:.2px;color:var(--brand)}
  #onboard h2 .g{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #onboard p{margin:0;color:rgba(243,239,228,.66);font-size:14.5px;max-width:460px;line-height:1.55}
  #countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;
    width:min(720px,92vw);max-height:46vh;overflow:auto;padding:4px}
  #countries button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;
    padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    font-size:13.5px;font-weight:600;color:var(--txt);transition:.15s}
  #countries button:hover{border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(204,120,92,.22)}
  #countries button .flag{width:24px;height:16px;border-radius:3px;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  #skip{all:unset;cursor:pointer;color:rgba(243,239,228,.7);font-size:13px;text-decoration:underline;
    text-underline-offset:3px}
  #skip:hover{color:var(--accent)}
  /* reopen-onboard button (bottom-left, above attribution) */
  #globe-btn{position:absolute;z-index:5;left:14px;bottom:54px;all:unset;cursor:pointer;
    width:40px;height:40px;border-radius:50%;text-align:center;line-height:40px;font-size:17px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px)}

  /* time slider (bottom) */
  #timebar{position:absolute;z-index:6;left:50%;bottom:24px;
    transform:translateX(-50%) translateY(200%);transition:transform .4s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;align-items:stretch;gap:9px;width:min(720px,94vw);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px;
    backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.5)}
  #timebar.on{transform:translateX(-50%)}
  .trow{display:flex;align-items:center;gap:14px}
  #erband{position:relative;height:20px;border-radius:6px;overflow:hidden;
    background:rgba(255,255,255,.04)}
  #erband .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;letter-spacing:.2px;color:rgba(0,0,0,.55);cursor:pointer;
    overflow:hidden;white-space:nowrap;border-right:1px solid rgba(0,0,0,.22);transition:filter .15s}
  #erband .seg:hover{filter:brightness(1.18)}
  #erband .seg.cur{box-shadow:inset 0 0 0 2px #fff,0 0 12px rgba(255,255,255,.4)}
  #eraname{flex:1;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  #eraname .vnflag{width:20px;height:14px;border-radius:2px;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  #play{all:unset;cursor:pointer;width:36px;height:36px;flex:none;border-radius:50%;text-align:center;
    line-height:36px;font-size:14px;color:var(--accent);background:rgba(204,120,92,.16)}
  #year{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:none;
    background:linear-gradient(90deg,#ff5a5a,#ff9a3c,#ffd479,#c08bff,#7aa0ff,#5ad1ff)}
  #year::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;cursor:pointer;box-shadow:0 0 10px var(--accent),0 0 0 4px rgba(255,255,255,.12)}
  #year::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:#fff;
    cursor:pointer;box-shadow:0 0 10px var(--accent)}
  #yearlabel{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:104px;
    text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #ecount{font-size:11px;color:var(--muted);min-width:62px;text-align:right;line-height:1.25}

  /* hover preview tooltip */
  #tip{position:fixed;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    transition:opacity .12s;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;backdrop-filter:blur(10px);width:188px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  #tip.show{opacity:1}
  #tip .t{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.3}
  #tip img{display:none;width:100%;height:88px;object-fit:cover;border-radius:6px;margin-top:6px}

  /* hint */
  #hint{position:absolute;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--muted);backdrop-filter:blur(10px);
    transition:opacity .4s;pointer-events:none}
  #hint b{color:var(--accent)}

  /* article panel */
  #panel{position:absolute;z-index:6;top:0;right:0;height:100%;width:min(420px,92vw);
    background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(16px);
    transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  #panel .hero{height:190px;background:#e7e1d4;background-size:cover;background-position:center;
    position:relative;flex:none}
  #panel .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,transparent 40%,var(--panel))}
  #close{position:absolute;top:12px;right:12px;z-index:2;all:unset;cursor:pointer;
    width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);text-align:center;
    line-height:32px;font-size:18px;color:#fff}
  #panel .body{padding:0 22px 24px;overflow:auto}
  #panel h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:-32px 0 4px;
    position:relative;line-height:1.18}
  #panel .meta{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:14px}
  #panel .extract{font-size:14.5px;line-height:1.7;color:#4a4641}
  #panel a.read{display:inline-block;margin-top:18px;text-decoration:none;font-weight:600;
    font-size:13.5px;color:#fff;padding:10px 18px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .loading{padding:40px 22px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="map"></div>

<button id="globe-btn" title="Chọn quốc gia">🌐</button>

<div id="onboard" class="hide">
  <h2>Bắt đầu hành trình từ <span class="g">đâu?</span></h2>
  <p>Chọn một quốc gia — quả địa cầu sẽ bay tới và xoay quanh nơi đó. Hoặc khám phá tự do.</p>
  <div id="countries"></div>
  <button id="skip">Khám phá tự do →</button>
</div>

<div id="bar">
  <div id="brand"><span class="dot"></span>WikiGlobe<small>tri thức theo địa lý</small></div>
  <div id="search">
    <div class="field"><span class="ico">🔍</span>
      <input id="q" type="text" placeholder="Tìm địa điểm…" autocomplete="off"
        spellcheck="false" enterkeyhint="search" /></div>
    <div id="results"></div>
  </div>
  <div class="spacer"></div>
  <button id="surprise" title="Bay tới một địa danh bất ngờ">✨ Khám phá</button>
  <button id="satbtn">🛰 Vệ tinh</button>
  <button id="timetoggle">🕰 Dòng thời gian</button>
  <div id="count">Đang chờ…</div>
  <div class="pill" id="lang">
    <button data-lang="vi" class="on">VI</button>
    <button data-lang="en">EN</button>
    <button data-lang="fr">FR</button>
    <button data-lang="ja">日本</button>
  </div>
</div>

<div id="hint">🌍 Chấm <b style="color:#ffd479">vàng</b> = đô thị · <b style="color:#cc785c">cam</b> = danh thắng/di sản · xoay & <b>zoom vào</b> để xem mọi bài</div>

<div id="timebar">
  <div id="erband" title="Các giai đoạn lịch sử Việt Nam"></div>
  <input id="year" type="range" min="-1830" max="2026" value="1500" step="1" aria-label="Năm" />
  <div class="trow">
    <button id="play" title="Tự chạy">▶</button>
    <div id="eraname"></div>
    <div id="yearlabel">1500</div>
    <div id="ecount"></div>
  </div>
</div>

<div id="tip"><div class="t"></div><img alt=""></div>

<aside id="panel">
  <button id="close">×</button>
  <div class="hero" id="hero"></div>
  <div class="body">
    <h1 id="p-title"></h1>
    <div class="meta" id="p-meta"></div>
    <div class="extract" id="p-extract"></div>
    <a class="read" id="p-link" target="_blank" rel="noopener">Đọc toàn bộ trên Wikipedia →</a>
  </div>
</aside>

<script>
const EMPTY = {type:'FeatureCollection', features:[]};
let LANG = 'vi';
let CITIES = [];                 // global "civilization" index from cities.js
let PLACES = [];                 // notable-places index from places.js (mid-zoom density)
let EVENTS = [];                 // dated history index from events.js
let timeMode = false;            // time slider active → globe shows history
// Wikipedia's geosearch gsbbox caps the box by AREA (~0.033 deg² empirically),
// not by zoom. So the live tier grid-samples the viewport into small cells and
// merges them. CELL² must stay under that cap; MAX_CELLS bounds parallel requests.
const CELL = 0.16;               // degrees per grid cell side (0.16² ≈ 0.026 deg²)
const MAX_CELLS = 28;            // above this the viewport is too big → global tier

/* ---------- shareable URL state: #zoom/lat/lng/lang ---------- */
const LANGS = ['vi','en','fr','ja'];
function readHash(){
  const p = location.hash.slice(1).split('/');
  const z=+p[0], lat=+p[1], lng=+p[2];
  if(!isFinite(z)||!isFinite(lat)||!isFinite(lng)) return null;
  let time=null;
  for(const seg of p.slice(3)) if(/^t-?\d+$/.test(seg)) time=parseInt(seg.slice(1),10);
  return {zoom:z, center:[lng,lat], lang:LANGS.includes(p[3])?p[3]:null, time};
}
const START = readHash();
if(START && START.lang) LANG = START.lang;

const map = new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources:{
      carto:{type:'raster',tileSize:256,attribution:'© OpenStreetMap, © CARTO',
        tiles:[
          'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://d.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png']},
      esri:{type:'raster',tileSize:256,attribution:'© Esri, Maxar, Earthstar Geographics',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']}
    },
    layers:[
      {id:'space',type:'background',paint:{'background-color':'#16130d'}},
      {id:'carto',type:'raster',source:'carto'},
      {id:'satellite',type:'raster',source:'esri',layout:{visibility:'none'}}
    ]
  },
  center:START? START.center : [108.2,14.0],
  zoom:START? START.zoom : 2.2,
  attributionControl:false,
  canvasContextAttributes:{antialias:true}
});
window.map = map;   // expose for console debugging
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');

map.on('style.load',()=> map.setProjection({type:'globe'}));

map.on('load',()=>{
  map.addSource('wiki',{type:'geojson',data:EMPTY,cluster:true,clusterRadius:48,clusterMaxZoom:11});

  map.addLayer({id:'clusters',type:'circle',source:'wiki',filter:['has','point_count'],
    paint:{
      'circle-color':['interpolate',['linear'],['get','point_count'],
        1,'#dca07e', 25,'#cc785c', 100,'#a8432a'],
      'circle-radius':['interpolate',['linear'],['get','point_count'],1,15,25,24,100,36],
      'circle-opacity':.9,'circle-stroke-width':1.5,'circle-stroke-color':'#fbf7ef'}});
  map.addLayer({id:'cluster-count',type:'symbol',source:'wiki',filter:['has','point_count'],
    layout:{'text-field':['get','point_count_abbreviated'],'text-size':13,
      'text-font':['Open Sans Bold','Noto Sans Bold']},
    paint:{'text-color':'#fff'}});

  map.addLayer({id:'point',type:'circle',source:'wiki',filter:['!',['has','point_count']],
    paint:{
      'circle-color':'#cc785c','circle-radius':6,
      'circle-stroke-width':2,'circle-stroke-color':'#fbf2e8',
      'circle-opacity':.95,'circle-stroke-opacity':.7}});
  map.addLayer({id:'point-glow',type:'circle',source:'wiki',filter:['!',['has','point_count']],
    paint:{'circle-color':'#cc785c','circle-radius':14,'circle-opacity':.14},'beforeId':'point'});

  /* ----- global "civilization" tier: notable cities from cities.json ----- */
  map.addSource('cities',{type:'geojson',data:EMPTY,cluster:true,clusterRadius:46,clusterMaxZoom:6});
  map.addLayer({id:'cities-clusters',type:'circle',source:'cities',filter:['has','point_count'],
    layout:{visibility:'none'},
    paint:{
      'circle-color':['interpolate',['linear'],['get','point_count'],
        1,'#c98a2e', 25,'#ffd479', 150,'#ffe9b0'],
      'circle-radius':['interpolate',['linear'],['get','point_count'],1,14,25,22,150,34],
      'circle-opacity':.85,'circle-stroke-width':1.5,'circle-stroke-color':'#2a1c05'}});
  map.addLayer({id:'cities-cluster-count',type:'symbol',source:'cities',filter:['has','point_count'],
    layout:{visibility:'none','text-field':['get','point_count_abbreviated'],'text-size':13,
      'text-font':['Open Sans Bold','Noto Sans Bold']},
    paint:{'text-color':'#2a1c05'}});
  const KIND_COLOR=['match',['get','kind'],'place','#cc785c','#ffd479'];
  map.addLayer({id:'cities-glow',type:'circle',source:'cities',filter:['!',['has','point_count']],
    layout:{visibility:'none'},
    paint:{'circle-color':KIND_COLOR,'circle-radius':13,'circle-opacity':.13}});
  map.addLayer({id:'cities-point',type:'circle',source:'cities',filter:['!',['has','point_count']],
    layout:{visibility:'none'},
    paint:{
      'circle-color':KIND_COLOR,'circle-radius':5.5,
      'circle-stroke-width':2,'circle-stroke-color':['match',['get','kind'],'place','#8f3a24','#c98a2e'],
      'circle-opacity':.95,'circle-stroke-opacity':.6}});

  CITIES=(window.WIKIGLOBE_CITIES&&window.WIKIGLOBE_CITIES.cities)||[];
  PLACES=(window.WIKIGLOBE_PLACES&&window.WIKIGLOBE_PLACES.places)||[];
  refreshGlobalTier();

  /* ----- time tier: dated historical events, colored by era ----- */
  const YEAR_COLOR=['interpolate',['linear'],['get','year'],
    -1830,'#ff5a5a', 0,'#ff7a3c', 1000,'#ffd479', 1500,'#c08bff', 1850,'#7aa0ff', 2026,'#5ad1ff'];
  map.addSource('events',{type:'geojson',data:EMPTY});
  map.addLayer({id:'events-glow',type:'circle',source:'events',layout:{visibility:'none'},

  map.on('click','cities-clusters',(e)=>{
    const f=map.queryRenderedFeatures(e.point,{layers:['cities-clusters']})[0];
    map.getSource('cities').getClusterExpansionZoom(f.properties.cluster_id).then(z=>{
      cinematic(f.geometry.coordinates, z+0.4, 30);

  map.on('click','cities-point',(e)=>openArticle(e.features[0].properties));
  for(const ly of ['cities-clusters','cities-point']){
    map.on('mouseenter',ly,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',ly,()=>map.getCanvas().style.cursor='');
  }

  map.on('click','clusters',(e)=>{
    const f=map.queryRenderedFeatures(e.point,{layers:['clusters']})[0];
    map.getSource('wiki').getClusterExpansionZoom(f.properties.cluster_id).then(z=>{
      cinematic(f.geometry.coordinates, z+0.4, 30);
    });
  });
  map.on('click','point',(e)=>openArticle(e.features[0].properties));
  for(const ly of ['clusters','point']){
    map.on('mouseenter',ly,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',ly,()=>map.getCanvas().style.cursor='');

  for(const ly of ['point','cities-point','events-point']){
    map.on('mousemove',ly,showTip);

  map.on('moveend',()=>{ updateTiers(); writeHash(); });
  map.on('idle',tickIdle);    // idle-only motion: free spin, or orbit a chosen country
  syncLangPill(); updateTiers();
  if(START && START.time!=null){ yearSlider.value=START.time; setTimeMode(true); }
  else writeHash();

function writeHash(){

  if(timeMode) h+=`/t${yearSlider.value}`;

  document.querySelectorAll('#lang button').forEach(b=>
    b.classList.toggle('on', b.dataset.lang===LANG));

/* ---------- tier orchestration: global cities vs live geosearch ---------- */
const setVis=(ids,on)=>ids.forEach(id=>
  map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none'));

let lastGlobalCount=0;
function refreshGlobalTier(){
  if(!map.getSource('cities')) return;
  const feats=[];
  const add=(arr,kind)=>{
    for(const c of arr){
      const title=c[3][LANG]; if(!title) continue;
      feats.push({type:'Feature',geometry:{type:'Point',coordinates:[c[0],c[1]]},
        properties:{title,kind}});
    }
  };
  add(CITIES,'city');     // warm-gold dots
  add(PLACES,'place');    // coral dots — heritage, landmarks, nature…
  lastGlobalCount=feats.length;
  map.getSource('cities').setData({type:'FeatureCollection',features:feats});
}

// How many grid cells the current viewport needs; Infinity if it wraps the
// antimeridian (we skip those frames). Drives the tier choice.
function viewportCells(){
  const b=map.getBounds();
  const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
  if(e<=w) return Infinity;
  return Math.ceil((e-w)/CELL)*Math.ceil((n-s)/CELL);
}

function updateTiers(){
  if(!map.getSource('cities')||!map.getSource('wiki')) return;
  if(timeMode) return;                           // time mode owns the layers
  const global = viewportCells() > MAX_CELLS;    // viewport too big for live grid
  setVis(['cities-clusters','cities-cluster-count','cities-glow','cities-point'], global);
  setVis(['clusters','cluster-count','point-glow','point'], !global);
  const hint=document.getElementById('hint'), count=document.getElementById('count');
  if(global){
    map.getSource('wiki').setData(EMPTY);
    hint.style.opacity=1;
    count.textContent = lastGlobalCount
      ? `${lastGlobalCount.toLocaleString('vi-VN')} địa điểm nổi bật · zoom vào để xem mọi bài`
      : 'Đang tải bản đồ tri thức…';
  } else {
    hint.style.opacity=0;
    loadArticles();
  }
}

/* ---------- spinning globe (idle only, when zoomed out) ---------- */
let userInteracting=false;
const SECONDS_PER_REV=140;
function spinGlobe(){
  // Bail while any easeTo/flyTo is in flight (e.g. a cluster-click zoom) so the
  // idle spin never hijacks programmatic navigation; the chain resumes on moveend.
  if(userInteracting || map.isMoving() || map.getZoom()>=4) return;
  const c=map.getCenter(); c.lng -= 360/SECONDS_PER_REV;
  map.easeTo({center:c,duration:1000,easing:n=>n});
}
/* cinematic orbit: keep a chosen country centred and slowly rotate the camera */
let orbitOn=false;
function orbitStep(){
  if(!orbitOn || userInteracting || map.isMoving()) return;
  map.easeTo({bearing:map.getBearing()+9,duration:1100,easing:n=>n});
}
function tickIdle(){ if(orbitOn) orbitStep(); else spinGlobe(); }
function exitOrbit(){ orbitOn=false; }   // user takes the wheel → stop orbiting

/* cinematic camera move — long eased flight with a dramatic tilt */
function cinematic(center, zoom, pitch, then){
  if(then) map.once('moveend',then);
  map.flyTo({center, zoom, pitch:pitch||0, bearing:0, duration:2600, curve:1.5, essential:true});
}

['mousedown','touchstart','wheel'].forEach(ev=>
  map.on(ev,()=>{userInteracting=true; exitOrbit();}));
['mouseup','touchend','dragend'].forEach(ev=>
  map.on(ev,()=>{userInteracting=false;}));   // 'idle' resumes the spin on its own

/* ---------- live tier: grid-sample the viewport via Wikipedia geosearch ----------
   gsbbox rejects boxes above ~0.033 deg², so one viewport request fails almost
   everywhere. Instead split the viewport into ≤MAX_CELLS small cells, fetch them
   in parallel, and merge + dedupe by pageid into a single layer. */
let reqId=0;
async function loadArticles(){
  if(!map.getSource('wiki')) return;
  const b=map.getBounds();
  const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
  if(e<=w) return;                       // crosses antimeridian → skip this frame
  const cols=Math.ceil((e-w)/CELL), rows=Math.ceil((n-s)/CELL);
  if(cols*rows>MAX_CELLS) return;        // updateTiers should have kept us global

  const my=++reqId;
  document.getElementById('count').textContent='Đang tải…';
  const cells=[];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const cw=w+i*CELL, ce=Math.min(cw+CELL,e);
    const cs=s+j*CELL, cn=Math.min(cs+CELL,n);
    cells.push(`${cn}%7C${cw}%7C${cs}%7C${ce}`);
  }
  try{
    const lists=await Promise.all(cells.map(box=>
      fetch(`https://${LANG}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
            `&list=geosearch&gslimit=500&gsbbox=${box}`)
        .then(r=>r.json()).then(j=>(j.query&&j.query.geosearch)||[]).catch(()=>[])));
    if(my!==reqId) return;               // a newer request superseded this one
    const seen=new Set(), features=[];
    for(const list of lists) for(const a of list){
      if(seen.has(a.pageid)) continue; seen.add(a.pageid);
      features.push({type:'Feature',
        geometry:{type:'Point',coordinates:[a.lon,a.lat]},
        properties:{title:a.title,pageid:a.pageid}});
    }
    map.getSource('wiki').setData({type:'FeatureCollection',features});
    document.getElementById('count').textContent=
      features.length? `${features.length} bài trong khung nhìn` : 'Không có bài ở vùng này';
  }catch(err){ if(my===reqId) document.getElementById('count').textContent='Lỗi mạng'; }
}

/* ---------- hover preview tooltip (title + thumbnail) ---------- */
const tip=document.getElementById('tip');
const tipTitle=tip.querySelector('.t'), tipImg=tip.querySelector('img');
const thumbCache=new Map();   // title → thumbnail URL ('' = none / in-flight)
function fetchThumb(title){
  if(thumbCache.has(title)) return;
  thumbCache.set(title,'');
  fetch(`https://${LANG}.wikipedia.org/api/rest_v1/page/summary/`+encodeURIComponent(title))
    .then(r=>r.json()).then(j=>{
      const src=(j.thumbnail&&j.thumbnail.source)||'';
      thumbCache.set(title,src);
      if(src && tip.classList.contains('show') && tipTitle.textContent===title){
        tipImg.src=src; tipImg.style.display='block';
      }
    }).catch(()=>{});
}
function showTip(e){
  const title=e.features[0].properties.title;
  tip.style.left=e.point.x+'px';
  tip.style.top=(e.point.y-14)+'px';
  tipTitle.textContent=title;
  const cached=thumbCache.get(title);
  if(cached){ tipImg.src=cached; tipImg.style.display='block'; }
  else { tipImg.style.display='none'; if(cached===undefined) fetchThumb(title); }
  tip.classList.add('show');
}
function hideTip(){ tip.classList.remove('show'); }

/* Vietnamese history periodised (non-overlapping) — the first detailed case.

const erband=document.getElementById('erband');

function eraPct(y){ const a=+yearSlider.min,b=+yearSlider.max;
  return (Math.max(a,Math.min(b,y))-a)/(b-a)*100; }
function buildEraBand(){
  erband.innerHTML=VN_ERAS.map((e,i)=>{
    const l=eraPct(e.s), w=eraPct(e.e)-l;
    return `<div class="seg" data-i="${i}" style="left:${l}%;width:${w}%;background:${e.c}"`+
      ` title="${e.n} (${fmtYear(e.s)} – ${fmtYear(e.e)})">${w>3.5?e.short:''}</div>`;
  }).join('');
  erband.onclick=ev=>{
    const seg=ev.target.closest('.seg'); if(!seg) return;
    const e=VN_ERAS[+seg.dataset.i];
    const mid=Math.round((Math.max(+yearSlider.min,e.s)+Math.min(+yearSlider.max,e.e))/2);
    stopPlay(); yearSlider.value=mid; refreshEvents();
  };
}
function updateEra(y){
  const cur=VN_ERAS.find(e=>y>=e.s && y<=e.e);
  eraname.innerHTML='<img class="vnflag" src="https://flagcdn.com/vn.svg" alt="VN"> '+
    (cur ? cur.n : 'Dòng sử Việt');
  [...erband.children].forEach((el,i)=>el.classList.toggle('cur',VN_ERAS[i]===cur));
}

function fmtYear(y){ return y<0 ? (-y)+' TCN' : ''+y; }

function refreshEvents(){
  if(!map.getSource('events')) return;
  const year=+yearSlider.value, W=EVENT_WINDOW, feats=[];
  for(const ev of EVENTS){
    const dy=Math.abs(ev[2]-year); if(dy>W) continue;
    const title=ev[3][LANG]; if(!title) continue;
    feats.push({type:'Feature',geometry:{type:'Point',coordinates:[ev[0],ev[1]]},
      properties:{title,year:ev[2],glow:+(1-dy/W).toFixed(3)}});
  }
  map.getSource('events').setData({type:'FeatureCollection',features:feats});
  yearLabel.textContent=fmtYear(year);
  ecount.textContent=feats.length+' sự kiện';
  updateEra(year);
  writeHash();
}

function stopPlay(){ if(playTimer){ clearInterval(playTimer); playTimer=0; playBtn.textContent='▶'; } }
function startPlay(){
  playBtn.textContent='⏸';
  playTimer=setInterval(()=>{
    let y=+yearSlider.value+6;
    if(y>+yearSlider.max) y=+yearSlider.min;   // loop back to the start of time
    yearSlider.value=y; refreshEvents();
  },110);
}

function setTimeMode(on){
  timeMode=on;
  timetoggle.classList.toggle('on',on);
  timebar.classList.toggle('on',on);
  setVis(['events-glow','events-point'],on);
  if(on){
    setVis(['cities-clusters','cities-cluster-count','cities-glow','cities-point',
            'clusters','cluster-count','point-glow','point'],false);
    document.getElementById('hint').style.opacity=0;
    document.getElementById('count').textContent='Dòng thời gian · '+EVENTS.length+' mốc lịch sử';
    buildEraBand(); refreshEvents();
  }else{
    stopPlay();
    map.getSource('events').setData(EMPTY);
    updateTiers(); writeHash();
  }
}

/* ---------- place search (Nominatim geocoder) ---------- */
const qInput=document.getElementById('q');
const resBox=document.getElementById('results');
const searchEl=document.getElementById('search');
let searchTimer=0, searchSeq=0, hits=[], selIdx=-1;

function clearResults(){ resBox.innerHTML=''; hits=[]; selIdx=-1; }
function renderMsg(text){ resBox.innerHTML=`<div class="row msg">${text}</div>`; }

function renderResults(){
  resBox.innerHTML=hits.map((h,i)=>{
    const name=h.display_name, comma=name.indexOf(', ');
    const head=comma<0?name:name.slice(0,comma), rest=comma<0?'':name.slice(comma+2);
    return `<div class="row${i===selIdx?' sel':''}" data-i="${i}">${head}`+
           (rest?`<small>${rest}</small>`:'')+`</div>`;
  }).join('');
}

async function runSearch(query){
  const my=++searchSeq;
  renderMsg('Đang tìm…');
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6'+
      `&accept-language=${LANG}&q=${encodeURIComponent(query)}`;
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(my!==searchSeq) return;            // superseded by a newer keystroke
    hits=j; selIdx=-1;
    if(!hits.length){ renderMsg('Không tìm thấy địa điểm'); return; }
    renderResults();
  }catch(e){ if(my===searchSeq) renderMsg('Lỗi tìm kiếm'); }
}

function gotoHit(h){
  if(!h) return;
  const bb=h.boundingbox;                 // [south, north, west, east] as strings
  if(bb){
    map.fitBounds([[+bb[2],+bb[0]],[+bb[3],+bb[1]]],{padding:80,maxZoom:13,duration:1200});
  }else{
    map.flyTo({center:[+h.lon,+h.lat],zoom:11,duration:1200});
  }
  clearResults(); qInput.value=h.display_name.split(', ')[0]; qInput.blur();
}

qInput.addEventListener('input',()=>{
  const v=qInput.value.trim();
  clearTimeout(searchTimer);
  if(v.length<2){ clearResults(); return; }
  searchTimer=setTimeout(()=>runSearch(v),350);   // debounce + respect Nominatim rate limit
});
qInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(hits.length){selIdx=(selIdx+1)%hits.length;renderResults();} }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(hits.length){selIdx=(selIdx-1+hits.length)%hits.length;renderResults();} }
  else if(e.key==='Enter'){ if(hits.length) gotoHit(hits[selIdx>=0?selIdx:0]); }
  else if(e.key==='Escape'){ clearResults(); qInput.blur(); }
});
resBox.addEventListener('mousedown',e=>{               // mousedown beats input blur
  const row=e.target.closest('.row[data-i]'); if(!row) return;
  e.preventDefault(); gotoHit(hits[+row.dataset.i]);
});
qInput.addEventListener('focus',()=>{ searchEl.classList.add('focus'); });
qInput.addEventListener('blur',()=>{ searchEl.classList.remove('focus'); setTimeout(clearResults,120); });

}
function initOnboard(){
  document.getElementById('countries').innerHTML=COUNTRIES.map((c,i)=>
    `<button data-i="${i}"><img class="flag" src="https://flagcdn.com/${c.cc}.svg" `+
    `alt="" loading="lazy" width="24" height="16">${c.n}</button>`).join('');
  document.getElementById('countries').addEventListener('click',e=>{
    const b=e.target.closest('button[data-i]'); if(!b) return;
    flyToCountry(COUNTRIES[+b.dataset.i]);
  });
  document.getElementById('skip').onclick=closeOnboard;
  document.getElementById('globe-btn').onclick=openOnboard;
  if(!START) setTimeout(openOnboard,350);   // shared deep-links skip onboarding
}
</script>
</body>
</html>
